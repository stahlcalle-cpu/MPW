<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>MPW</title>
    <meta http-equiv="cache-control" content="max-age=0"/>
    <meta http-equiv="cache-control" content="no-cache"/>
    <meta http-equiv="expires" content="0"/>
    <meta http-equiv="pragma" content="no-cache"/>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
            background:#f0f2f5;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .login-box{
            background:#002359;
            border-radius:16px;
            padding:44px 38px;
            width:340px;
            box-shadow:0 8px 32px rgba(0,35,89,0.25);
        }
        .lock-icon{
            width:52px;height:52px;
            background:rgba(0,159,223,0.12);
            border-radius:14px;
            display:flex;align-items:center;justify-content:center;
            margin:0 auto 32px;
        }
        .lock-icon svg{width:24px;height:24px;fill:#009fdf}
        .pw-container{
            position:relative;
            margin-bottom:16px;
        }
        .pw-container input[type="password"],
        .pw-container input[type="text"]{
            width:100%;
            background:rgba(255,255,255,0.07);
            border:1.5px solid rgba(255,255,255,0.12);
            border-radius:10px;
            color:#ffffff;
            padding:14px 44px 14px 16px;
            font-size:15px;
            font-family:inherit;
            transition:all .2s;
        }
        .pw-container input:focus{
            outline:none;
            border-color:#009fdf;
            box-shadow:0 0 0 3px rgba(0,159,223,0.2);
            background:rgba(255,255,255,0.1);
        }
        .pw-container input::placeholder{color:rgba(255,255,255,0.6)}
        .toggle-pw{
            position:absolute;right:12px;top:50%;transform:translateY(-50%);
            cursor:pointer;opacity:0.5;height:18px;width:18px;padding:0;
            transition:opacity .2s;
        }
        .toggle-pw:hover{opacity:0.8}
        .remember-row{
            display:flex;align-items:center;gap:8px;
            margin-bottom:20px;
            color:rgba(255,255,255,0.75);font-size:13px;
        }
        .remember-row input[type="checkbox"]{accent-color:#009fdf;width:14px;height:14px}
        .remember-row.hidden{display:none}
        .submit-btn{
            width:100%;
            background:#009fdf;color:#fff;border:none;
            border-radius:10px;padding:14px;
            font-size:15px;font-weight:700;font-family:inherit;
            cursor:pointer;transition:all .2s;letter-spacing:.3px;
        }
        .submit-btn:hover{
            background:#00b4ff;
            transform:translateY(-1px);
            box-shadow:0 4px 16px rgba(0,159,223,0.3);
        }
        .submit-btn:active{transform:translateY(0)}
        .error-msg{
            color:#ff6380;font-size:13px;font-weight:600;
            text-align:center;margin-top:14px;
            display:none;
        }
        .staticrypt-spinner-container{
            position:fixed;top:0;left:0;right:0;bottom:0;
            background:#f0f2f5;
            display:flex;align-items:center;justify-content:center;
            z-index:999;
        }
        .staticrypt-spinner{
            width:36px;height:36px;
            border:3px solid rgba(0,35,89,0.1);
            border-top-color:#009fdf;
            border-radius:50%;
            animation:spin .7s linear infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        .hidden{display:none!important}
    </style>
</head>
<body>

            const { isSuccessful } = await staticrypt.handleDecryptionOfPage(pw, remember);
            if(!isSuccessful){
                const err = document.getElementById('staticrypt-error');
                err.style.display = 'block';
                document.getElementById('staticrypt-password').value = '';
                setTimeout(()=> err.style.display = 'none', 2500);
            }
        });
    </script>
</body>
</html>
